<html lang="vi">
<head>
    {{header_init}}
    <title>Giải Đấu & Sự Kiện Cờ Tướng (Xiangqi) – Cơ Sở Dữ Liệu elephantchess.io</title>
    <meta name="description"
          content="Duyệt các giải đấu, chức vô địch và sự kiện Cờ Tướng (Xiangqi). Bảng xếp hạng, ván đấu và kết quả từ các giải đấu Xiangqi lớn trên toàn thế giới."/>
    <link rel="stylesheet" href="/css/common/nice-table.css"/>
    <link rel="stylesheet" href="/css/database/database.css"/>
    <link rel="stylesheet" href="/css/database/database-events-list.css"/>
    <script defer src="/js/infinite-scroll-page.js"></script>
    <script defer src="/js/database/database-events-list.js"></script>

<body>
{{body_init}}
<div class="main-container-text">

    <div class="center-content-div" style="flex-direction: column">

{{kofi_floating_widget}}
