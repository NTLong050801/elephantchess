<div id="join-game-confirmation-modal" class="modal-content" data-nosnippet>
    <button class="modal-close-button" aria-label="Close">×</button>
    <h2>Tham gia ván?</h2>
    <div id="join-game-container" class="center-content-div">
        <table id="join-game-modal-table">
            <tr>
                <td class="left-side">
                    Đối thủ
                </td>
                <td class="right-side">
                    <span id="join-game-opponent">
                        <span id="join-game-status-indicator" class="online-status-indicator online-status-indicator-smaller"></span>
                    </span>
                </td>
            </tr>
            <tr>
                <td class="left-side">
                    Chế độ
                </td>
                <td class="right-side">
                    <span id="join-game-rating-mode"></span>
                </td>
            </tr>
            <tr>
                <td class="left-side">
                    Điểm
                </td>
                <td class="right-side">
                    <span id="join-game-rating"></span>
                </td>
            </tr>
            <tr>
                <td class="left-side">
                    Màu quân
                </td>
                <td class="right-side">
                    <span id="join-game-color"></span>
                </td>
            </tr>
            <tr>
                <td class="left-side">
                    Thời gian
                </td>
                <td class="right-side">
                    <span id="join-game-tc"></span>
                </td>
            </tr>
        </table>
    </div>
    <div class="modal-buttons-panel">
        <input id="join-game-join-button" type="button" class="app-buttons" value="tham gia">
        <input id="join-game-decline-button" type="button" class="app-buttons-red" value="từ chối">
    </div>
</div>
