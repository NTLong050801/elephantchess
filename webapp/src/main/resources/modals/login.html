<div id="login-modal" class="modal-content" data-nosnippet>
    <button class="modal-close-button" aria-label="Close">×</button>
    <h2>Đăng nhập</h2>
    <p>
        Chưa có tài khoản? Bạn có thể <b><span id="signup-span" class="action-link">đăng ký</span></b>.
    </p>
    <div class="modal-form-label">
        Email hoặc tên đăng nhập<br/>
        <input id="login-field" type="text"/>
    </div>
    <div class="modal-form-label">
        Mật khẩu<br/>
        <input id="password-field" type="password"/>
    </div>
    <div class="modal-buttons-panel">
        <input id="login-ok-button" type="button" class="app-buttons" value="đăng nhập">
    </div>
    <div class="password-recovery-link">
        <span class="sub-text"><a href="/recovery">Quên mật khẩu</a></span>
    </div>
</div>
