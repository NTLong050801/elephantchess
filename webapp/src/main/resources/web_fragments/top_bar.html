<div id="top-bar-menu">
    <div id="top-menu-main-container" class="main-container">
        <div class="discord-logo-container center-div-content">
            <a href="https://discord.gg/WEGDqnWXNg" target="_blank">
                <img src="/images/discord-logo-smaller-black.png" alt="join our Discord" loading="lazy">
            </a>
        </div>
        <a id="top-bar-menu-item-lobby" class="top-bar-menu-items" href="/">
            <img src="/images/icons/home-optimized.png" class="top-bar-menu-items-icons" alt="lobby" loading="lazy">
            <div class="top-bar-menu-label">Sảnh chờ</div>
            <div id="number-of-games-in-lobby-counter-circle" class="notification-counter-circle">
                <div id="number-of-games-in-lobby-counter-counter" class="notification-counter-value"></div>
            </div>
        </a>
        <a id="top-bar-menu-item-new-game" class="top-bar-menu-items" onclick="showNewGameModal()">
            <img src="/images/icons/swords-optimized.png" class="top-bar-menu-items-icons" alt="play bot"
                 loading="lazy">
            <div class="top-bar-menu-label">Chơi</div>
        </a>
        <a id="top-bar-menu-item-play-bot" class="top-bar-menu-items" onclick="showPlayBotModal()">
            <img src="/images/icons/bot-icon-optimized.png" class="top-bar-menu-items-icons" alt="play bot"
                 loading="lazy">
            <div class="top-bar-menu-label">Chơi với máy</div>
        </a>
        <a id="top-bar-menu-item-puzzles" class="top-bar-menu-items" href="/puzzles">
            <img src="/images/icons/puzzle-piece-optimized.png" class="top-bar-menu-items-icons" alt="puzzles">
            <div class="top-bar-menu-label">Cờ thế</div>
        </a>
        <a id="top-bar-menu-item-analysis" class="top-bar-menu-items" href="/analysis">
            <img src="/images/icons/pie-chart-optimized.png" class="top-bar-menu-items-icons" alt="analysis board"
                 loading="lazy">
            <div class="top-bar-menu-label">Phân tích</div>
        </a>
        <div id="login-side">
            <div id="user-turn-to-play-games-container">
                <div id="user-turn-to-play-games-header">
                    <img src="/images/icons/simple-grid.svg" id="user-turn-to-play-games-header-icon"
                         alt="turn to play">
                    <div id="user-turn-to-play-games-counter-circle" class="notification-counter-circle">
                        <div id="user-turn-to-play-games-counter-value" class="notification-counter-value">
                            0
                        </div>
                    </div>
                </div>
                <div id="user-turn-to-play-games-panel">
                    <div style="width: 100%; text-align: center;" data-nosnippet>
                        Các ván đến lượt bạn đi
                    </div>
                    <div id="user-turn-to-play-games-list-container" data-nosnippet></div>
                    <div id="user-turn-to-play-games-empty-list-message" class="empty-list-message" data-nosnippet>
                        Hiện không có ván nào đến lượt bạn đi. Bạn có thể
                        tạo ván mới ở <a href="/">Sảnh chờ</a>. Xem tất cả ván của bạn tại <a href="/userdata/games">trang này</a>.
                    </div>
                </div>
            </div>
            <div id="handle-menu-container">
                <div id="user-profile-icon">
                    <img id="user-profile-icon-img" src="/images/icons/more.png" alt="menu" loading="lazy">
                </div>
                <div id="handle-div"></div>
            </div>
        </div>
    </div>
</div>
